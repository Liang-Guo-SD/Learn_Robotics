<text x="12" y="37.882" font-size="4.4" fill="#1B2430" font-weight="600" data-block="a-head" class="txt">How LeRobot works</text>
<text x="156" y="37.882" font-size="4.4" fill="#1B2430" font-weight="600" data-block="a-parts-head" class="txt">The five parts</text>
<text x="282" y="37.882" font-size="4.4" fill="#1B2430" font-weight="600" data-block="a-time-head" class="txt">One time step in your dataset</text>
<text x="12" y="42.793" font-size="2.75" fill="#1B2430" font-weight="400" data-block="a-lead" data-line="0" data-w="138" class="txt">LeRobot learns a task by copying you. You drive the robot, it saves what the robot sensed and what you</text>
<text x="12" y="46.593" font-size="2.75" fill="#1B2430" font-weight="400" data-block="a-lead" data-line="1" data-w="138" class="txt">commanded, and a neural network learns to produce the same commands from the same observations.</text>
<text x="12" y="50.949" font-size="2.75" fill="#1B2430" font-weight="600" data-block="step-name0" class="txt">Teleoperate</text>
<text x="12" y="54.966" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent0" data-line="0" data-w="31.05" class="txt">You command the</text>
<text x="12" y="58.766" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent0" data-line="1" data-w="31.05" class="txt">robot with a leader</text>
<text x="12" y="62.566" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent0" data-line="2" data-w="31.05" class="txt">arm and gamepad.</text>
<text x="12" y="66.366" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent0" data-line="3" data-w="31.05" class="txt">Nothing is learned yet.</text>
<text x="47.65" y="50.949" font-size="2.75" fill="#1B2430" font-weight="600" data-block="step-name1" class="txt">Record</text>
<text x="47.65" y="54.966" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent1" data-line="0" data-w="31.05" class="txt">Each attempt becomes</text>
<text x="47.65" y="58.766" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent1" data-line="1" data-w="31.05" class="txt">an episode: video,</text>
<text x="47.65" y="62.566" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent1" data-line="2" data-w="31.05" class="txt">state and action</text>
<text x="47.65" y="66.366" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent1" data-line="3" data-w="31.05" class="txt">at every time step.</text>
<text x="83.3" y="50.949" font-size="2.75" fill="#1B2430" font-weight="600" data-block="step-name2" class="txt">Train</text>
<text x="83.3" y="54.966" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent2" data-line="0" data-w="31.05" class="txt">A policy learns</text>
<text x="83.3" y="58.766" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent2" data-line="1" data-w="31.05" class="txt">to predict your</text>
<text x="83.3" y="62.566" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent2" data-line="2" data-w="31.05" class="txt">actions from each</text>
<text x="83.3" y="66.366" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent2" data-line="3" data-w="31.05" class="txt">recorded observation.</text>
<text x="118.95" y="50.949" font-size="2.75" fill="#1B2430" font-weight="600" data-block="step-name3" class="txt">Deploy</text>
<text x="118.95" y="54.966" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent3" data-line="0" data-w="31.05" class="txt">The policy drives</text>
<text x="118.95" y="58.766" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent3" data-line="1" data-w="31.05" class="txt">the robot. You count</text>
<text x="118.95" y="62.566" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent3" data-line="2" data-w="31.05" class="txt">real successes,</text>
<text x="118.95" y="66.366" font-size="2.75" fill="#1B2430" font-weight="400" data-block="step-sent3" data-line="3" data-w="31.05" class="txt">not training loss.</text>
<text x="12" y="70.322" font-size="2.45" fill="#1B2430" font-weight="400" data-block="step-cmd0" class="txt"><tspan font-family="Menlo,Consolas,monospace">lerobot-teleoperate</tspan></text>
<text x="47.65" y="70.322" font-size="2.45" fill="#1B2430" font-weight="400" data-block="step-cmd1" class="txt"><tspan font-family="Menlo,Consolas,monospace">lerobot-record</tspan></text>

<text x="12" y="77.069" font-size="2.45" fill="#1B2430" font-weight="400" data-block="loop-label" class="txt">Improve: take over when it fails. Your corrections become new data.</text>

<text x="156" y="42.793" font-size="2.45" fill="#1B2430" font-weight="400" data-block="part-Robot" class="txt"><tspan font-family="Menlo,Consolas,monospace">Robot</tspan></text>
<text x="178.5" y="42.793" font-size="2.75" fill="#1B2430" font-weight="400" data-block="partmean-Robot" data-line="0" data-w="97.5" class="txt"><tspan>Your hardware as a Python class: </tspan><tspan font-family="Menlo,Consolas,monospace">get_observation()</tspan></text>
<text x="178.5" y="46.593" font-size="2.75" fill="#1B2430" font-weight="400" data-block="partmean-Robot" data-line="1" data-w="97.5" class="txt"><tspan>reads it, </tspan><tspan font-family="Menlo,Consolas,monospace">send_action()</tspan><tspan> moves it.</tspan></text>
<text x="156" y="54.212" font-size="2.45" fill="#1B2430" font-weight="400" data-block="part-Teleoperator" class="txt"><tspan font-family="Menlo,Consolas,monospace">Teleoperator</tspan></text>
<text x="178.5" y="54.212" font-size="2.75" fill="#1B2430" font-weight="400" data-block="partmean-Teleoperator" data-line="0" data-w="97.5" class="txt"><tspan>The human as a Python class: </tspan><tspan font-family="Menlo,Consolas,monospace">get_action()</tspan><tspan> returns your command.</tspan></text>
<text x="156" y="61.831" font-size="2.45" fill="#1B2430" font-weight="400" data-block="part-Processor" class="txt"><tspan font-family="Menlo,Consolas,monospace">Processor</tspan></text>
<text x="178.5" y="61.831" font-size="2.75" fill="#1B2430" font-weight="400" data-block="partmean-Processor" data-line="0" data-w="97.5" class="txt">Converts and limits data between teleoperator, dataset and robot.</text>
<text x="156" y="69.45" font-size="2.45" fill="#1B2430" font-weight="400" data-block="part-LeRobotDataset" class="txt"><tspan font-family="Menlo,Consolas,monospace">LeRobotDataset</tspan></text>
<text x="178.5" y="69.45" font-size="2.75" fill="#1B2430" font-weight="400" data-block="partmean-LeRobotDataset" data-line="0" data-w="97.5" class="txt"><tspan>Numbers in Parquet, video in MP4, schema and statistics in </tspan><tspan font-family="Menlo,Consolas,monospace">meta/</tspan><tspan>.</tspan></text>
<text x="156" y="77.069" font-size="2.45" fill="#1B2430" font-weight="400" data-block="part-Policy" class="txt"><tspan font-family="Menlo,Consolas,monospace">Policy</tspan></text>
<text x="178.5" y="77.069" font-size="2.75" fill="#1B2430" font-weight="400" data-block="partmean-Policy" data-line="0" data-w="97.5" class="txt">A network that turns one observation into a chunk of future actions.</text>
<text x="282" y="42.793" font-size="2.45" fill="#1B2430" font-weight="400" data-block="feat-observation.images.wrist" class="txt"><tspan font-family="Menlo,Consolas,monospace">observation.images.wrist</tspan></text>

<text x="282" y="49.487" font-size="2.45" fill="#1B2430" font-weight="400" data-block="feat-observation.images.head" class="txt"><tspan font-family="Menlo,Consolas,monospace">observation.images.head</tspan></text>

<text x="320.5" y="66.625" font-size="2.45" fill="#1B2430" font-weight="400" data-block="note-action" class="txt">9 numbers: 7 arm + x.vel + theta.vel</text>
<text x="282" y="77.069" font-size="2.45" fill="#566070" font-weight="400" data-block="time-note" data-line="0" data-w="126" class="txt">Predicting a chunk of actions at once keeps motion smooth and limits compounding errors.</text>

<text x="345" y="177.983" font-size="2.45" fill="#1B2430" font-weight="400" data-block="after-1" data-line="0" data-w="58" class="txt">Learn on the robot: HIL-SERL</text>
<text x="345" y="181.173" font-size="2.45" fill="#1B2430" font-weight="400" data-block="after-1" data-line="1" data-w="58" class="txt">for short arm-only tasks.</text>
<text x="345" y="187.019" font-size="2.45" fill="#1B2430" font-weight="400" data-block="after-2" data-line="0" data-w="58" class="txt">Try larger models: Pi0.5 fits in Spark</text>
<text x="345" y="190.209" font-size="2.45" fill="#1B2430" font-weight="400" data-block="after-2" data-line="1" data-w="58" class="txt">memory, but expect long runs.</text>
<text x="345" y="196.056" font-size="2.45" fill="#1B2430" font-weight="400" data-block="after-3" data-line="0" data-w="58" class="txt">Share it: publish your dataset</text>
<text x="345" y="199.246" font-size="2.45" fill="#1B2430" font-weight="400" data-block="after-3" data-line="1" data-w="58" class="txt">and model card on the Hub.</text>
<text x="12" y="218.969" font-size="4.4" fill="#1B2430" font-weight="600" data-block="p1-head" class="txt">Three computers, three jobs</text>
<text x="13.9" y="228.369" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p1-node-0" class="txt">Robot Orin</text>
<text x="57.4" y="228.369" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p1-node-1" class="txt">Station Orin</text>
<text x="100.9" y="228.369" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p1-node-2" class="txt">DGX Spark</text>
<text x="33.75" y="223.269" font-size="2.45" fill="#566070" font-weight="400" text-anchor="middle" data-block="p1-flow0" class="txt">wired network</text>
<text x="77.25" y="223.269" font-size="2.45" fill="#566070" font-weight="400" text-anchor="middle" data-block="p1-flow1" class="txt">datasets</text>
<text x="77.25" y="232.369" font-size="2.45" fill="#566070" font-weight="400" text-anchor="middle" data-block="p1-flow2" class="txt">trained policies</text>
<text x="12" y="237.902" font-size="2.45" fill="#1B2430" font-weight="400" data-block="role-0" data-line="0" data-w="41" class="txt"><tspan font-weight="600" fill="#1B2430">Robot</tspan><tspan> </tspan><tspan font-weight="600" fill="#1B2430">Orin,</tspan><tspan> </tspan><tspan fill="#566070">on</tspan><tspan> </tspan><tspan fill="#566070">the</tspan><tspan> </tspan><tspan fill="#566070">chassis:</tspan></text>
<text x="12" y="241.092" font-size="2.45" fill="#1B2430" font-weight="400" data-block="role-0" data-line="1" data-w="41" class="txt">Motors, cameras, lidar and</text>
<text x="12" y="244.282" font-size="2.45" fill="#1B2430" font-weight="400" data-block="role-0" data-line="2" data-w="41" class="txt">safety. Runs ACT directly.</text>
<text x="12" y="247.472" font-size="2.45" fill="#1B2430" font-weight="400" data-block="role-0" data-line="3" data-w="41" class="txt">Budget its power on the battery.</text>
<text x="55.5" y="237.902" font-size="2.45" fill="#1B2430" font-weight="400" data-block="role-1" data-line="0" data-w="41" class="txt"><tspan font-weight="600" fill="#1B2430">Station</tspan><tspan> </tspan><tspan font-weight="600" fill="#1B2430">Orin,</tspan><tspan> </tspan><tspan fill="#566070">on</tspan><tspan> </tspan><tspan fill="#566070">the</tspan><tspan> </tspan><tspan fill="#566070">bench:</tspan></text>
<text x="55.5" y="241.092" font-size="2.45" fill="#1B2430" font-weight="400" data-block="role-1" data-line="1" data-w="41" class="txt">Leader arm, gamepad, monitor.</text>
<text x="55.5" y="244.282" font-size="2.45" fill="#1B2430" font-weight="400" data-block="role-1" data-line="2" data-w="41" class="txt">Records datasets to an added</text>
<text x="55.5" y="247.472" font-size="2.45" fill="#1B2430" font-weight="400" data-block="role-1" data-line="3" data-w="41" class="txt">NVMe drive. Serves large policies.</text>
<text x="99" y="237.902" font-size="2.45" fill="#1B2430" font-weight="400" data-block="role-2" data-line="0" data-w="41" class="txt"><tspan font-weight="600" fill="#1B2430">DGX</tspan><tspan> </tspan><tspan font-weight="600" fill="#1B2430">Spark,</tspan><tspan> </tspan><tspan fill="#566070">in</tspan><tspan> </tspan><tspan fill="#566070">the</tspan><tspan> </tspan><tspan fill="#566070">lab:</tspan><tspan> Trains</tspan></text>
<text x="99" y="241.092" font-size="2.45" fill="#1B2430" font-weight="400" data-block="role-2" data-line="1" data-w="41" class="txt">every policy, one job at a time,</text>
<text x="99" y="244.282" font-size="2.45" fill="#1B2430" font-weight="400" data-block="role-2" data-line="2" data-w="41" class="txt">and keeps the master datasets.</text>
<text x="99" y="247.472" font-size="2.45" fill="#1B2430" font-weight="400" data-block="role-2" data-line="3" data-w="41" class="txt">Never in the control loop.</text>
<text x="12" y="252.155" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p1-work" data-line="0" data-w="138" class="txt">Most stages: record on Station Orin, train on the Spark, run on Robot Orin.</text>
<text x="12" y="256.838" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p1-timing" data-line="0" data-w="138" class="txt">Plan overnight runs: one published SmolVLA example, 20,000 steps</text>
<text x="12" y="260.028" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p1-timing" data-line="1" data-w="138" class="txt">at batch 64, took about 30 h on a Spark. Time your own first run.</text>
<text x="12" y="264.411" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p1-setup0" data-line="0" data-w="138" class="txt"><tspan>Spark: </tspan><tspan font-family="Menlo,Consolas,monospace">uv</tspan><tspan> </tspan><tspan font-family="Menlo,Consolas,monospace">venv</tspan><tspan> </tspan><tspan font-family="Menlo,Consolas,monospace">--python</tspan><tspan> </tspan><tspan font-family="Menlo,Consolas,monospace">3.12</tspan><tspan>, then install from the v0.6.0 tag.</tspan></text>
<text x="12" y="268.794" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p1-setup1" data-line="0" data-w="138" class="txt"><tspan>Orin: JetPack 7.2 and Python 3.12. Install the Jetson torch wheel first, then </tspan><tspan font-family="Menlo,Consolas,monospace">pip</tspan><tspan> </tspan><tspan font-family="Menlo,Consolas,monospace">install</tspan><tspan> </tspan><tspan font-family="Menlo,Consolas,monospace">lerobot==0.6.0</tspan><tspan> </tspan><tspan font-family="Menlo,Consolas,monospace">--no-deps</tspan></text>
<text x="12" y="271.984" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p1-setup1" data-line="1" data-w="138" class="txt">and its dependencies by hand. This recipe was tested on Orin NX, so verify it on AGX.</text>
<text x="12" y="276.367" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p1-setup2" data-line="0" data-w="138" class="txt">Both are ARM machines, so LeRobot decodes video with PyAV.</text>
<text x="156" y="218.969" font-size="4.4" fill="#1B2430" font-weight="600" data-block="p2-head" class="txt">What one lidar plane sees</text>
<text x="169.2" y="227.18" font-size="2.45" fill="#1B2430" font-weight="400" data-block="lbl-head" class="txt">head camera</text>
<text x="198.6" y="238.78" font-size="2.45" fill="#1B2430" font-weight="400" data-block="lbl-lidar" class="txt">lidar</text>
<text x="205.2" y="239.48" font-size="2.45" fill="#1B2430" font-weight="400" data-block="lbl-plane" class="txt">lidar plane</text>
<text x="206.2" y="245.78" font-size="2.45" fill="#1B2430" font-weight="400" data-block="lbl-hit" class="txt">ray stops here</text>
<text x="226.3" y="245.18" font-size="2.45" fill="#1B2430" font-weight="400" data-block="lbl-leg" class="txt">table leg</text>
<text x="237.2" y="232.98" font-size="2.45" fill="#1B2430" font-weight="400" data-block="lbl-cup" class="txt">cup</text>
<text x="249.972" y="234.98" font-size="2.45" fill="#1B2430" font-weight="400" data-block="lbl-button" class="txt">button</text>
<text x="205.6" y="254.18" font-size="2.45" fill="#1B2430" font-weight="400" data-block="lbl-caster" class="txt">caster</text>
<text x="205.942" y="231.98" font-size="2.45" fill="#1B2430" font-weight="400" data-block="lbl-wrist" class="txt">wrist camera</text>
<text x="156" y="259.127" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p2-0" data-line="0" data-w="120" class="txt">It scans one horizontal slice at chassis height. The drawing shows</text>
<text x="156" y="262.317" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p2-0" data-line="1" data-w="120" class="txt">the robot parked for the cup; it drives elsewhere to press the button.</text>
<text x="156" y="265.863" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p2-1" data-line="0" data-w="120" class="txt">Sees: walls, table legs, people's legs, and the button panel when nothing blocks it.</text>
<text x="156" y="269.41" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p2-2" data-line="0" data-w="120" class="txt">Misses: the cup, the tabletop, the arm, stairs and drop-offs.</text>
<text x="156" y="272.957" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p2-3" data-line="0" data-w="120" class="txt">So cameras find the targets. The lidar keeps distance and stops the base.</text>
<text x="156" y="276.503" font-size="2.45" fill="#1B2430" font-weight="400" data-block="p2-4" data-line="0" data-w="120" class="txt">LeRobot has no lidar class. Your driver reports 16 sector distances as floats, and they join observation.state.</text>
<text x="282" y="218.969" font-size="4.4" fill="#1B2430" font-weight="600" data-block="p3-head" class="txt">How to master it</text>
<text x="282" y="224.53" font-size="2.75" fill="#1B2430" font-weight="600" data-block="ladder-0" class="txt">Run it</text>
<text x="282" y="227.98" font-size="2.45" fill="#566070" font-weight="400" data-block="ladder-def-0" data-line="0" data-w="28.5" class="txt">The command works.</text>
<text x="314.5" y="224.53" font-size="2.75" fill="#1B2430" font-weight="600" data-block="ladder-1" class="txt">Explain it</text>
<text x="314.5" y="227.98" font-size="2.45" fill="#566070" font-weight="400" data-block="ladder-def-1" data-line="0" data-w="28.5" class="txt">You can say what</text>
<text x="314.5" y="231.17" font-size="2.45" fill="#566070" font-weight="400" data-block="ladder-def-1" data-line="1" data-w="28.5" class="txt">it wrote and why.</text>
<text x="347" y="224.53" font-size="2.75" fill="#1B2430" font-weight="600" data-block="ladder-2" class="txt">Change it</text>
<text x="347" y="227.98" font-size="2.45" fill="#566070" font-weight="400" data-block="ladder-def-2" data-line="0" data-w="28.5" class="txt">You alter one</text>
<text x="347" y="231.17" font-size="2.45" fill="#566070" font-weight="400" data-block="ladder-def-2" data-line="1" data-w="28.5" class="txt">part on purpose.</text>
<text x="379.5" y="224.53" font-size="2.75" fill="#1B2430" font-weight="600" data-block="ladder-3" class="txt">Debug it</text>
<text x="379.5" y="227.98" font-size="2.45" fill="#566070" font-weight="400" data-block="ladder-def-3" data-line="0" data-w="28.5" class="txt">You fix a failure</text>
<text x="379.5" y="231.17" font-size="2.45" fill="#566070" font-weight="400" data-block="ladder-def-3" data-line="1" data-w="28.5" class="txt">from the logs.</text>
<text x="285.2" y="236.583" font-size="2.45" fill="#1B2430" font-weight="400" data-block="rule-0-lead" class="txt">Trace one frame by hand before you trust a command.</text>
<text x="285.6" y="240.13" font-size="2.45" fill="#566070" font-weight="400" data-block="rule-0-reason" data-line="0" data-w="122.4" class="txt"><tspan>Follow it from </tspan><tspan font-family="Menlo,Consolas,monospace">get_observation()</tspan><tspan> to the dataset row to the policy output.</tspan></text>
<text x="285.2" y="245.676" font-size="2.45" fill="#1B2430" font-weight="400" data-block="rule-1-lead" class="txt">Watch your dataset before you train on it.</text>
<text x="285.6" y="249.223" font-size="2.45" fill="#566070" font-weight="400" data-block="rule-1-reason" data-line="0" data-w="122.4" class="txt">A bad episode teaches bad behavior.</text>
<text x="285.2" y="254.77" font-size="2.45" fill="#1B2430" font-weight="400" data-block="rule-2-lead" class="txt">Change one thing per experiment, and write it down.</text>
<text x="285.6" y="258.317" font-size="2.45" fill="#566070" font-weight="400" data-block="rule-2-reason" data-line="0" data-w="122.4" class="txt">Otherwise you cannot tell what helped.</text>
<text x="285.2" y="263.863" font-size="2.45" fill="#1B2430" font-weight="400" data-block="rule-3-lead" class="txt">Count real successes as k of n.</text>
<text x="285.6" y="267.41" font-size="2.45" fill="#566070" font-weight="400" data-block="rule-3-reason" data-line="0" data-w="122.4" class="txt">8 of 10 still allows a true rate of 49–94% (95% Wilson interval).</text>
<text x="285.2" y="272.957" font-size="2.45" fill="#1B2430" font-weight="400" data-block="rule-4-lead" class="txt">When the docs and the robot disagree, read the source.</text>
<text x="285.6" y="276.503" font-size="2.45" fill="#566070" font-weight="400" data-block="rule-4-reason" data-line="0" data-w="122.4" class="txt">LeRobot changes quickly, and the code is the final word.</text>
<text x="12" y="282.8" font-size="2.45" fill="#566070" font-weight="400" data-block="foot-left" data-line="0" data-w="244" class="txt">Times are planning estimates at about 8 hours per week, about 19 weeks in total. Pass targets are starter values: tune them to your hardware and justify the change.</text>
<text x="261.313" y="282.8" font-size="2.45" fill="#566070" font-weight="400" data-block="foot-right" data-line="0" data-w="236" class="txt"><tspan>Checked Nov 2026 against LeRobot v0.6 docs. Commands and flags change between releases, so pin one version and use </tspan><tspan font-family="Menlo,Consolas,monospace">--help</tspan><tspan>.</tspan></text>
</svg>
